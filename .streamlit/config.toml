mkdir -p .streamlit
cat > .streamlit/config.toml << 'EOF'
[theme]
base = "light"
primaryColor = "#37572F"
backgroundColor = "#F2F7F1"
secondaryBackgroundColor = "#DCEFD9"
textColor = "#1E1E1E"
font = "sans serif"
EOF

git add .streamlit/config.toml
git commit -m "fix: tema claro y colores fijos"
git push
